name: TsFile Model Compatibility Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-table-tree-models:
    name: Test Table & Tree Model Compatibility
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Run all backend tests
        run: |
          cd backend
          mvn clean test
        
      - name: Run Table Model Integration Tests
        run: |
          cd backend
          mvn test -Dtest=TableModelIntegrationTest
          
      - name: Run Tree Model Integration Tests
        run: |
          cd backend
          mvn test -Dtest=TreeModelIntegrationTest
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: backend/target/surefire-reports/
          
      - name: Test Report
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Maven Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
